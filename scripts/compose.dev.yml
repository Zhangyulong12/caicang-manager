services:
  postgres:
    image: postgres:16-alpine
    container_name: caicang-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: caicang
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-in-env}
      POSTGRES_DB: caicang
      TZ: UTC
    volumes:
      - caicang_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caicang -d caicang"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  caicang_pgdata:
